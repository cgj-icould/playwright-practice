- case_name: "正向用例：正常邮箱和密码"
  email: "user@example.com"
  password: "ValidPass123"
  expected_status: 200
- case_name: "逆向用例：邮箱缺失"
  email: ""
  password: "ValidPass123"
  expected_status: 400
- case_name: "逆向用例：密码缺失"
  email: "user@example.com"
  password: ""
  expected_status: 400
- case_name: "逆向用例：邮箱格式错误"
  email: "invalid-email"
  password: "ValidPass123"
  expected_status: 400
- case_name: "边界值用例：极短邮箱和密码"
  email: "a@b.c"
  password: "a"
  expected_status: 400
- case_name: "边界值用例：超长邮箱和密码"
  email: "a123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890@example.com"
  password: "a123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890"
  expected_status: 400